# Opens a pull request when a dependency (npm) or a GitHub Action has an update.
# The tests run on each of these pull requests (workflows/test.yml): merge them when they are green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates grouped in one pull request; major versions come one by one (they can break things)
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
